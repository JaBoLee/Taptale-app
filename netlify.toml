# ย้ายไป GitHub Pages แล้ว (22 พ.ย. 2569) — สั่งให้ Netlify ข้ามทุก build เพื่อไม่ให้กินเครดิต
# ("exit 0" ในคำสั่ง ignore = ไม่ต้อง build)
[build]
  ignore = "exit 0"
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
